name: CI

# `workflow_call` matters: release.yml invokes this file rather than repeating
# its steps, so there is exactly one definition of "the gate" and a release can
# never run a weaker one than a pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attribution:
    name: attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `ci.py attribution` reads the last 20 commit messages; the default
          # shallow clone of depth 1 would silently scan one commit and pass.
          fetch-depth: 25
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Scan the tracked tree and recent commits
        run: python scripts/ci.py attribution

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned on purpose. An unpinned linter turns a green repository red on a
      # morning when nobody changed anything. Bumping this is a pull request.
      - name: Install ruff
        run: pip install "ruff==0.16.1"
      - name: Lint
        run: ruff check .

  types:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The package is installed, not just mypy: numpy ships its own type
      # information, so checking with it present is real checking, while
      # checking without it degrades every numpy expression to Any and reports
      # a missing stub instead.
      - name: Install the package and mypy
        run: pip install -e "." "mypy==2.3.1"
      - name: Type check
        run: mypy

  test:
    name: pytest
    runs-on: ${{ matrix.os }}
    strategy:
      # One red cell must not hide the others. Which platform fails is the
      # information a matrix exists to produce.
      fail-fast: false
      matrix:
        # macOS is here and not in the sibling libraries for one reason:
        # `soundfile` is a binding to libsndfile, a C library. The three
        # platforms ship it differently, and "the wheel had no usable
        # libsndfile on macOS" is a failure no amount of Linux testing finds.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and its dev extra
        run: pip install -e ".[dev]"
      - name: Run the test suite
        run: pytest -q
      # The `asr` extra is faster-whisper, and the tests drive a fake ASR
      # object instead of installing it, so nothing here has a reason to skip.
      - name: Nothing is skipped
        run: python scripts/ci.py noskips

  clone:
    name: a fresh clone can run its own tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # This job exists because of a real defect. ttsproof is a src-layout
      # package, and before CI a fresh clone could not run its own tests: all
      # four test modules died at collection with ModuleNotFoundError unless
      # ttsproof was already installed. Every other job installs the package
      # first and would never have noticed.
      - name: Install pytest and the runtime dependencies, but not the package
        run: pip install "pytest>=8" "numpy>=1.24" "soundfile>=0.12"
      - name: Run the suite against the bare checkout
        run: pytest -q

  contract:
    name: published contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the package
        run: pip install -e "."
      # `ttsproof regress` exiting 1 on a quality drop is the promise other
      # people put in their own pipelines. If it stops returning 1 their gate
      # becomes decorative and nothing tells them.
      - name: Exit-code contract
        run: python scripts/ci.py contract

  package:
    name: build and verify the artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install "build==1.5.1" "twine==6.2.0"
      - name: Versions agree
        run: python scripts/ci.py version
      - name: Build sdist and wheel
        run: python -m build
      - name: Metadata is renderable
        run: twine check dist/*
      # Everything above tests the source tree; this installs the artifact a
      # user would download, into an interpreter with no source directory on
      # its path, and asks it to work.
      - name: Install the wheel into a clean environment and smoke it
        run: python scripts/ci.py wheelcheck
      # Advisory, never blocking: between releases the current version IS on
      # PyPI, which is correct, and a gate that is red by design gets ignored.
      # The release workflow runs the same check as a hard gate.
      - name: Is this version still free on PyPI?
        continue-on-error: true
        run: python scripts/ci.py pypi
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
